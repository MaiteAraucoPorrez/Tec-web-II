<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GESTION DE CALIFICACIONES TS</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <div class="contador">
    <h2 class="contador__titulo">Puntaje</h2>
    
    <p id="valor" class="contador__valor">0</p>
    
    <div class="contador__acciones">
      <button id="restar" class="btn btn--restar">-5</button>
      <button id="sumar" class="btn btn--sumar">+5</button>
      <button id="resetear" class="btn btn--resetear">Reset</button>
      <button id="aprobar" class="btn btn--aprobar">Aprobar automaticamente</button>
      <p id="mensaje" class="contador__mensaje"></p>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
