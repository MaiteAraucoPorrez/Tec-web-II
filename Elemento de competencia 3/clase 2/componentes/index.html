<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contador TS</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <div class="contador">
    <h2 class="contador__titulo">Contador</h2>
    
    <p id="valor" class="contador__valor">0</p>
    
    <div class="contador__acciones">
      <button id="restar" class="btn btn--restar">-</button>
      <button id="sumar" class="btn btn--sumar">+</button>
      <button id="resetear" class="btn btn--resetear">Resetear</button>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
