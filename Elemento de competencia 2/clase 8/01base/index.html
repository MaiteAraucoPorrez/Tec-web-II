<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Formulario de contacto para el Servicio Web. Envía tu nombre y correo electrónico de forma rápida y sencilla.">
  <meta name="author" content="Maite Arauco">
  <meta name="keywords" content="Servicio Web, Formularios, HTML, CSS, JavaScript">
  <title>Formulario de Contacto | Servicio Web</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header>
  <h1>Bienvenido al Servicio Web</h1>
</header>

<nav aria-label="Navegación principal">
  <a href="#">Inicio</a>
  <a href="#">Servicios</a>
  <a href="#">Contacto</a>
</nav>

<main>
  <h2>Formulario de Contacto</h2>
  <img src="img/icon.png" alt="Icono del servicio web" class="icono">

  <form id="formulario" aria-label="Formulario de contacto" novalidate>
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" name="nombre" placeholder="Juan Pérez" required aria-required="true">

    <label for="correo">Correo electrónico</label>
    <input type="email" id="correo" name="correo" placeholder="juanperez@gmail.com" required aria-required="true">

    <button type="submit">Enviar</button>
  </form>

  <p id="mensaje" role="status" aria-live="polite"></p>
</main>


<script src="js/script.js" defer></script>
</body>
</html>
