<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <div class ="container">
    <h1>Registro</h1>

    <form id="formulario">
      <label for="nombre">Nombre completo</label> <br><br>
      <input type="text" id="nombre" placeholder="Ej: Juan Pérez"><br><br><br>
      <label for="correo">Correo electrónico</label> <br><br>
      <input type="email" id="correo" placeholder="Ej: juan@gmail.com"><br><br>
      <div class ="botones">
        <button type="button" id="boton2">Cancelar</button>
        <button type="submit" id="boton">Enviar</button>
      </div>
      <p id="mensaje"></p>
    </form>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
