<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Interactividad con JavaScript</title>
<link rel="stylesheet" href="css/estilos.css">
</head>

<body>

  <h1>Ejemplo de Interactividad</h1>

  <!-- BOTÓN QUE CAMBIA COLOR -->
  <section>
    <h2>1. Cambiar color</h2>
    <button id="btnColor">Cambiar color</button>
  </section>

  <!-- MOSTRAR / OCULTAR -->
  <section>
    <h2>2. Mostrar / Ocultar contenido</h2>

    <button id="btnToggle">Mostrar información</button>

    <p id="info">
      Este es un texto que puede aparecer o desaparecer usando JavaScript.
    </p>
  </section>

  <!-- FORMULARIO -->
  <section>
    <h2>3. Validación simple de formulario</h2>

      <form id="formulario">

        <label>Nombre:</label>
        <input type="text" id="nombre">

        <button type="submit">Enviar</button>

        <p id="mensaje"></p>

      </form>

  </section>

<script src="js/script.js"></script>

</body>
</html>
