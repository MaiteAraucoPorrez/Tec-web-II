<!Doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Una aplicación simple para gestionar tus tareas diarias">
  <meta name="keywords" content="tareas, lista de tareas, gestión de tareas, productividad">
  <meta name="author" content="Maite">
  <title>Lista de Tareas</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

  <header class="header">
    <h1>Mis tareas</h1>
  </header>

  <main class ="contenedor">
    <section class="tareas">
      <img src="img/tarea.webp" alt="Tarea" loading="lazy">

      <form id="formulario">
        <label for="tarea">Nueva tarea:</label>
        <input type="text" id="tarea" placeholder="Escribe una tarea" min="0">
        <button type="button" onclick="agregarTarea()">Agregar</button>

        <ul id="lista" role="alert" aria-live="assertive"></ul>
      </form>
    </section>
  </main>

  <script src="js/script.js" defer></script>

</body>
</html>
