<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Práctica Responsive</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>

  <header class="header">
    <h1 class="logo">Café Andino</h1>

    <nav class="nav">
      <a href="#">Inicio</a>
      <a href="#">Nosotros</a>
      <a href="#">Menú</a>
      <a href="#">Contacto</a>
    </nav>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h2>Categorías</h2>
      <ul>
        <li>Clásicos</li>
        <li>Fríos</li>
        <li>Postres</li>
        <li>Granos</li>
      </ul>
    </aside>

    <main class="content">
      <section class="hero">
        <h2>Tu pausa perfecta</h2>
        <p>Interfaz base para adaptar a móvil, tablet y desktop usando media queries.</p>
        <div class="actions">
          <button class="btn btn--primary">Ver menú</button>
          <button class="btn btn--ghost">Reservar</button>
        </div>
      </section>

      <section class="cards">
        <article class="card">Producto 1</article>
        <article class="card">Producto 2</article>
        <article class="card">Producto 3</article>
        <article class="card">Producto 4</article>
        <article class="card">Producto 5</article>
        <article class="card">Producto 6</article>
      </section>
    </main>
  </div>

  <footer class="footer">
    © 2026 Café Andino
  </footer>

</body>
</html>
